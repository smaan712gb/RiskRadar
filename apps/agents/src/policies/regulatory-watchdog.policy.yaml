# NemoClaw Sandbox Policy: Regulatory Watchdog Agent
# Special permissions: allowed to access external regulatory websites

agent:
  id: regulatory-watchdog
  name: Regulatory Watchdog
  team: analysis
  domain: compliance

security:
  sandbox:
    user: riskradar-regulatory
    cpu_limit: 2
    memory_limit: 4GB
    max_runtime: 48h

network_policy:
  default: deny
  allow:
    # Local inference (uses Tier 2 for impact analysis)
    - host: nemotron-inference.local:8080
      protocol: https
      purpose: "Local LLM inference (Cascade-2 for regulatory analysis)"
    - host: api.riskradar.local:3001
      protocol: https
      purpose: "Policy updates and alert creation"
    - host: redis.riskradar.local:6379
      protocol: tcp
      purpose: "Agent messaging"

    # EXTERNAL: Regulatory source websites (read-only web scraping)
    - host: www.fincen.gov:443
      protocol: https
      purpose: "FinCEN advisories and orders"
      read_only: true
    - host: www.occ.gov:443
      protocol: https
      purpose: "OCC bulletins and alerts"
      read_only: true
    - host: www.fdic.gov:443
      protocol: https
      purpose: "FDIC Financial Institution Letters"
      read_only: true
    - host: www.sec.gov:443
      protocol: https
      purpose: "SEC enforcement actions"
      read_only: true
    - host: ofac.treasury.gov:443
      protocol: https
      purpose: "OFAC sanctions updates"
      read_only: true
    - host: www.consumerfinance.gov:443
      protocol: https
      purpose: "CFPB rules and policy"
      read_only: true
    - host: www.federalreserve.gov:443
      protocol: https
      purpose: "Fed supervisory guidance"
      read_only: true
    - host: www.nist.gov:443
      protocol: https
      purpose: "NIST framework updates"
      read_only: true
    - host: www.eba.europa.eu:443
      protocol: https
      purpose: "EU EBA guidelines"
      read_only: true
    - host: www.fatf-gafi.org:443
      protocol: https
      purpose: "FATF publications"
      read_only: true

    # Search APIs (for OpenClaw search skills)
    - host: api.exa.ai:443
      protocol: https
      purpose: "Exa search API for regulatory monitoring"
    - host: api.tavily.com:443
      protocol: https
      purpose: "Tavily search API for regulatory monitoring"

file_policy:
  read:
    - /data/regulatory/**
    - /config/regulatory-watchdog.yaml
    - /skills/regulatory/**/*
  write:
    - /data/regulatory/updates/**
    - /data/alerts/compliance/**
    - /logs/regulatory-watchdog/**
  deny:
    - /data/hr/**
    - /data/finance/**
    - /data/security/**

audit:
  log_all_network: true
  log_all_file_access: true
  log_all_model_inference: true
  log_external_web_access: true
  retention_days: 2555  # 7 years for regulatory audit trail
