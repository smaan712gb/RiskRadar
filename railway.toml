# RiskRadar — Railway Deployment Configuration
# Deploys web dashboard + API service

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile.web"

[deploy]
startCommand = "pnpm --filter @riskradar/web exec next start -p $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.envs]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
