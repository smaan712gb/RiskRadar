# Google Cloud Build configuration for RiskRadar
# Builds and deploys API + Web to Cloud Run

steps:
  # Build API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/riskradar-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/riskradar-api:latest'
      - '-f'
      - 'deploy/docker/Dockerfile.api'
      - '.'

  # Build Web image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/riskradar-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/riskradar-web:latest'
      - '-f'
      - 'deploy/docker/Dockerfile.web'
      - '.'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/riskradar-api:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/riskradar-web:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/riskradar-api:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/riskradar-web:latest']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'riskradar-api'
      - '--image=gcr.io/$PROJECT_ID/riskradar-api:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--port=3001'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=DATABASE_URL=riskradar-db-url:latest,REDIS_URL=riskradar-redis-url:latest,JWT_SECRET=riskradar-jwt-secret:latest,ENCRYPTION_KEY=riskradar-encryption-key:latest'

  # Deploy Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'riskradar-web'
      - '--image=gcr.io/$PROJECT_ID/riskradar-web:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--port=3000'

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/riskradar-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/riskradar-web:$COMMIT_SHA'

timeout: '1200s'
